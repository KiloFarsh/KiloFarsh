name: generate github stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate-stats:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v3
        with:
          ref: 'main'

      - name: Generate SVGs
        run: |
          curl -o github-stats.svg "https://github-readme-stats.vercel.app/api?username=KiloFarsh&show_icons=true&theme=dark&hide_border=true"
          curl -o github-top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=KiloFarsh&layout=compact&theme=dark&hide_border=true&exclude_repo=KiloFarsh"

      - name: Commit and Push to output branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Создаем чистую независимую ветку прямо из текущих файлов
          git checkout --orphan output-clean
          git rm -rf . --cached 2>/dev/null || true
          
          # Индексируем только наши сгенерированные карточки
          git add github-stats.svg github-top-langs.svg
          
          git commit -m "Update GitHub Statistics" || exit 0
          
          # Принудительно перезаписываем ветку output на сервере
          git push origin output-clean:output --force
